apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hello-
  namespace: argo
spec:
  entrypoint: hello

  templates:
    - name: hello
      container:
        image: busybox:1.36
        command: [sh, -c]
        args:
          - |
            echo "Hello from Argo Workflow"
            echo "Running on $(hostname)"
            date
