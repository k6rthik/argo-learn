apiVersion: batch/v1
kind: CronJob
metadata:
  name: echo-cron
spec:
  schedule: "10 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: echo
              image: busybox:1.36
              command:
                - sh
                - -c
              args:
                - |
                  echo "I am running..."
                  date
